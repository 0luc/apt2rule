name: Build data and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 18 * * *" # daily, 19:07 CET / 20:07 CEST: pick up new Elastic rulesets and ATT&CK releases
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Restore source cache
        uses: actions/cache@v4
        with:
          path: pipeline/.cache
          key: sources-${{ github.run_id }}
          restore-keys: sources-
      - name: Pipeline tests
        working-directory: pipeline
        run: uv run --python 3.12 pytest -q
      - name: Build datasets
        working-directory: pipeline
        run: uv run --python 3.12 python -m apt2rule_pipeline --out ../web/public/data --cache .cache
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test and build site
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
